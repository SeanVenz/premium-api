<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Purchase Test</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        select, input, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            background-color: #007cba;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #005a8b;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #card-element {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: white;
        }
        .error {
            color: #e74c3c;
            margin-top: 10px;
        }
        .success {
            color: #27ae60;
            margin-top: 10px;
        }
        .price {
            font-size: 24px;
            font-weight: bold;
            color: #007cba;
            text-align: center;
            margin: 20px 0;
        }
        .hidden {
            display: none;
        }
        .user-info {
            background: #e8f4fd;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .logout-btn {
            background-color: #e74c3c;
            width: auto;
            padding: 5px 15px;
            font-size: 14px;
            float: right;
        }
        .logout-btn:hover {
            background-color: #c0392b;
        }
        .saved-methods {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .payment-method-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .payment-method-item:hover {
            background-color: #f0f0f0;
        }
        .payment-method-item.selected {
            background-color: #e8f4fd;
            border-color: #007cba;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div id="login-section">
            <h1>Login to Purchase License</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" id="login-button">Login</button>
            </form>
            <div id="login-error" class="error"></div>
        </div>

        <!-- Payment Form -->
        <div id="payment-section" class="hidden">
            <div class="user-info">
                <button class="logout-btn" onclick="logout()">Logout</button>
                <h3>Welcome, <span id="logged-in-user"></span>!</h3>
                <p>Purchase a license key for your project</p>
            </div>

            <!-- Saved Payment Methods -->
            <div id="saved-methods-section" class="saved-methods hidden">
                <h4>Saved Payment Methods</h4>
                <div id="saved-methods-list"></div>
                <button type="button" id="use-new-card-btn">Use New Card</button>
            </div>

            <form id="payment-form">
                <div class="form-group">
                    <label for="project-select">Select Project:</label>
                    <select id="project-select" required>
                        <option value="">Choose a project...</option>
                        <option value="pikocode-premium">Pikocode Premium</option>
                        <option value="quiz-builder">Quiz Builder</option>
                    </select>
                </div>

                <div class="price">$29.99 USD</div>

                <div id="new-card-section">
                    <div class="form-group">
                        <label for="card-element">Card Details:</label>
                        <div id="card-element">
                            <!-- Stripe Elements will create form elements here -->
                        </div>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="save-payment-method"> Save payment method for future purchases
                        </label>
                    </div>
                </div>

                <div id="card-errors" class="error"></div>

                <button type="submit" id="submit-button">
                    <span id="button-text">Purchase License</span>
                    <span id="spinner" style="display: none;">Processing...</span>
                </button>
            </form>

            <div id="payment-result"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
        let stripe;
        let elements;
        let cardElement;
        let currentUser = null;
        let savedPaymentMethods = [];
        let selectedSavedMethod = null;

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
        });

        // Check authentication status
        async function checkAuthStatus() {
            try {
                const response = await fetch(`${API_BASE_URL}/users/profile`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const userData = await response.json();
                    currentUser = userData;
                    showPaymentSection();
                } else {
                    showLoginSection();
                }
            } catch (error) {
                console.error('Error checking auth status:', error);
                showLoginSection();
            }
        }

        // Show login section
        function showLoginSection() {
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('payment-section').classList.add('hidden');
        }

        // Show payment section
        async function showPaymentSection() {
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('payment-section').classList.remove('hidden');
            document.getElementById('logged-in-user').textContent = currentUser.username;
            
            await initializeStripe();
            await loadSavedPaymentMethods();
        }

        // Handle login
        document.getElementById('login-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const email = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE_URL}/users/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password }),
                });

                const result = await response.json();

                if (response.ok) {
                    currentUser = result.user;
                    showPaymentSection();
                } else {
                    document.getElementById('login-error').textContent = result.message || 'Login failed';
                }
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('login-error').textContent = 'Login failed. Please try again.';
            }
        });

        // Logout function
        async function logout() {
            try {
                await fetch(`${API_BASE_URL}/users/logout`, {
                    method: 'POST',
                    credentials: 'include'
                });
                currentUser = null;
                showLoginSection();
                // Clear form
                document.getElementById('login-form').reset();
                document.getElementById('payment-form').reset();
                document.getElementById('login-error').textContent = '';
                document.getElementById('payment-result').innerHTML = '';
            } catch (error) {
                console.error('Logout error:', error);
            }
        }

        // Initialize Stripe
        async function initializeStripe() {
            try {
                const response = await fetch(`${API_BASE_URL}/payments/config`);
                const config = await response.json();
                
                stripe = Stripe(config.publishableKey);
                elements = stripe.elements();

                cardElement = elements.create('card', {
                    style: {
                        base: {
                            fontSize: '16px',
                            color: '#424770',
                            '::placeholder': {
                                color: '#aab7c4',
                            },
                        },
                    },
                });

                cardElement.mount('#card-element');

                cardElement.on('change', ({error}) => {
                    const displayError = document.getElementById('card-errors');
                    if (error) {
                        displayError.textContent = error.message;
                    } else {
                        displayError.textContent = '';
                    }
                });

            } catch (error) {
                console.error('Error initializing Stripe:', error);
                document.getElementById('payment-result').innerHTML = 
                    '<div class="error">Error loading payment system.</div>';
            }
        }

        // Load saved payment methods
        async function loadSavedPaymentMethods() {
            try {
                const response = await fetch(`${API_BASE_URL}/payments/payment-methods`, {
                    credentials: 'include'
                });

                if (response.ok) {
                    const data = await response.json();
                    savedPaymentMethods = data.paymentMethods;
                    
                    if (savedPaymentMethods.length > 0) {
                        displaySavedPaymentMethods();
                    }
                }
            } catch (error) {
                console.error('Error loading saved payment methods:', error);
            }
        }

        // Display saved payment methods
        function displaySavedPaymentMethods() {
            const savedMethodsSection = document.getElementById('saved-methods-section');
            const savedMethodsList = document.getElementById('saved-methods-list');
            
            savedMethodsList.innerHTML = '';

            savedPaymentMethods.forEach(method => {
                const methodDiv = document.createElement('div');
                methodDiv.className = 'payment-method-item';
                methodDiv.onclick = () => selectSavedMethod(method.id, methodDiv);
                
                methodDiv.innerHTML = `
                    <div>
                        <strong>${method.card.brand.toUpperCase()} **** ${method.card.last4}</strong>
                        <div>Expires ${method.card.exp_month}/${method.card.exp_year}</div>
                    </div>
                `;
                
                savedMethodsList.appendChild(methodDiv);
            });

            savedMethodsSection.classList.remove('hidden');
            document.getElementById('new-card-section').classList.add('hidden');
        }

        // Select saved payment method
        function selectSavedMethod(methodId, element) {
            selectedSavedMethod = methodId;
            
            // Update UI
            document.querySelectorAll('.payment-method-item').forEach(item => {
                item.classList.remove('selected');
            });
            element.classList.add('selected');
        }

        // Use new card button
        document.getElementById('use-new-card-btn').addEventListener('click', () => {
            selectedSavedMethod = null;
            document.querySelectorAll('.payment-method-item').forEach(item => {
                item.classList.remove('selected');
            });
            document.getElementById('new-card-section').classList.remove('hidden');
        });

        // Handle payment form submission
        document.getElementById('payment-form').addEventListener('submit', async (event) => {
            event.preventDefault();

            const submitButton = document.getElementById('submit-button');
            const buttonText = document.getElementById('button-text');
            const spinner = document.getElementById('spinner');
            const projectName = document.getElementById('project-select').value;

            if (!projectName) {
                document.getElementById('card-errors').textContent = 'Please select a project';
                return;
            }

            submitButton.disabled = true;
            buttonText.style.display = 'none';
            spinner.style.display = 'inline';

            try {
                if (selectedSavedMethod) {
                    // Use saved payment method
                    await payWithSavedMethod(projectName, selectedSavedMethod);
                } else {
                    // Use new card
                    await payWithNewCard(projectName);
                }
            } catch (error) {
                console.error('Payment error:', error);
                document.getElementById('card-errors').textContent = 'An unexpected error occurred.';
            }

            submitButton.disabled = false;
            buttonText.style.display = 'inline';
            spinner.style.display = 'none';
        });

        // Pay with saved method
        async function payWithSavedMethod(projectName, paymentMethodId) {
            const response = await fetch(`${API_BASE_URL}/payments/pay-with-saved-method`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include',
                body: JSON.stringify({
                    projectName: projectName,
                    paymentMethodId: paymentMethodId,
                    amount: 2999
                }),
            });

            const result = await response.json();

            if (result.success) {
                displayPaymentSuccess(result);
            } else if (result.requiresAction) {
                // Handle 3D Secure or other authentication
                const {error} = await stripe.confirmCardPayment(result.clientSecret);
                if (error) {
                    document.getElementById('card-errors').textContent = error.message;
                } else {
                    // Payment succeeded after authentication
                    location.reload(); // Reload to show success
                }
            } else {
                document.getElementById('card-errors').textContent = result.error || 'Payment failed';
            }
        }

        // Pay with new card
        async function payWithNewCard(projectName) {
            const savePaymentMethod = document.getElementById('save-payment-method').checked;

            const response = await fetch(`${API_BASE_URL}/payments/create-payment-intent`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include',
                body: JSON.stringify({
                    projectName: projectName,
                    amount: 2999,
                    savePaymentMethod: savePaymentMethod
                }),
            });

            const { clientSecret } = await response.json();

            const result = await stripe.confirmCardPayment(clientSecret, {
                payment_method: {
                    card: cardElement,
                }
            });

            if (result.error) {
                document.getElementById('card-errors').textContent = result.error.message;
            } else {
                if (result.paymentIntent.status === 'succeeded') {
                    handlePaymentSuccess(result.paymentIntent.id);
                }
            }
        }

        // Handle successful payment
        async function handlePaymentSuccess(paymentIntentId) {
            try {
                const response = await fetch(`${API_BASE_URL}/payments/payment-success`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        paymentIntentId: paymentIntentId
                    }),
                });

                const result = await response.json();

                if (result.success) {
                    displayPaymentSuccess(result);
                    // Reload saved payment methods
                    await loadSavedPaymentMethods();
                } else {
                    document.getElementById('payment-result').innerHTML = 
                        '<div class="error">Error generating license. Please contact support.</div>';
                }
            } catch (error) {
                console.error('Error handling payment success:', error);
                document.getElementById('payment-result').innerHTML = 
                    '<div class="error">Error processing payment. Please contact support.</div>';
            }
        }

        // Display payment success
        function displayPaymentSuccess(result) {
            document.getElementById('payment-result').innerHTML = `
                <div class="success">
                    <h3>Payment Successful! 🎉</h3>
                    <p><strong>Your License Key:</strong></p>
                    <p style="font-family: monospace; background: #f0f0f0; padding: 10px; border-radius: 5px;">${result.license.licenseKey}</p>
                    <p><strong>Project:</strong> ${result.license.project}</p>
                    <p><strong>Features:</strong> ${result.license.features.join(', ')}</p>
                    <p><strong>Payment ID:</strong> ${result.paymentDetails.id}</p>
                </div>
            `;
        }
    </script>
</body>
</html>
